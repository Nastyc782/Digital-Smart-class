spring.datasource.url=jdbc:mysql://localhost:3306/digital_smart_class?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-secret-before-production-32bytes-minimum}
app.jwt.expiration-minutes=480
app.upload-dir=${UPLOAD_DIR:./uploads}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:admin@digitalsmartclass.rw}
app.admin.password=${ADMIN_PASSWORD:ChangeMe@2026}
app.accountant.email=${ACCOUNTANT_EMAIL:accountant@digitalsmartclass.rw}
app.accountant.password=${ACCOUNTANT_PASSWORD:ChangeMe@2026}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
