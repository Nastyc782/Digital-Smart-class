<style>
:root{--bg:#F5F6F4;--card:#fff;--ink:#17242B;--mute:#63727A;--line:#DDE3E1;--brand:#0B6E6E;--brand2:#E3F2F0;--mtn:#FFCC00;--ok:#1E8E4E;--warn:#B7791F;--bad:#C2413B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}

:root[data-theme="dark"]{--bg:#0F1719;--card:#172226;--ink:#E7EEEE;--mute:#93A4A8;--line:#26363B;--brand:#3FB8B0;--brand2:#12302F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}h2{font-size:20px}h3{font-size:16px}

.logo{font:800 18px 'Bricolage Grotesque',sans-serif}.logo i{display:inline-block;width:12px;height:12px;background:var(--mtn);border-radius:3px;margin-right:6px}
.roles{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px;margin-left:auto}
.roles button{border:0;background:none;color:var(--mute);padding:6px 12px;border-radius:8px;font:500 13px Inter;cursor:pointer}
.roles button.on{background:var(--brand);color:#fff}
nav{display:flex;gap:4px;padding:8px 20px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card)}
nav button{border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:8px;font:500 14px Inter;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--brand2);color:var(--brand);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:24px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{display:block;font:800 26px 'Bricolage Grotesque'}.stat span{color:var(--mute);font-size:13px}
.btn{border:0;background:var(--brand);color:#fff;padding:9px 16px;border-radius:8px;font:600 14px Inter;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}.btn.mtn{background:var(--mtn);color:#17242B}

.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.PENDING{background:#FFF1D6;color:var(--warn)}.APPROVED{background:#DDF3E6;color:var(--ok)}.REJECTED{background:#FBE1DF;color:var(--bad)}.LOCKED{background:var(--line);color:var(--mute)}
.tblw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:500}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 12px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mute{color:var(--mute);font-size:13px}.pay{background:var(--mtn);color:#17242B;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.lesson{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--card)}
.lesson.cur{border-color:var(--brand);background:var(--brand2)}
.video{aspect-ratio:16/9;background:#0d1a1c;border-radius:10px;display:grid;place-items:center;color:#9fd;margin-bottom:10px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:90%}
#toast.on{opacity:1}
.deny{text-align:center;padding:50px 10px}.deny h1{font-size:64px;color:var(--bad)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.hero{display:grid;grid-template-columns:1.1fr 1fr;max-width:980px;margin:16px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(11,60,70,.10)}

.lift{transition:transform .15s,box-shadow .15s}.lift:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(11,60,70,.14)}
.band{height:76px;margin:-16px -16px 12px;border-radius:12px 12px 0 0;display:grid;place-items:center;color:#fff;font:800 30px 'Bricolage Grotesque'}
.ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:conic-gradient(var(--brand) var(--p),var(--line) 0)}.ring span{background:var(--card);width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.np{position:absolute;right:0;top:46px;width:min(340px,86vw);max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.2);padding:6px;z-index:8}.np div{padding:9px;border-bottom:1px solid var(--line);font-size:13px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--bg);font-size:14px}.msg.me{align-self:flex-end;background:var(--brand);color:#fff}.msg small{display:block;opacity:.7;font-size:11px}.msg.ann{border:2px solid var(--mtn)}
.PAID{background:#DDF3E6;color:var(--ok)}@media print{header,nav,.no,#toast{display:none!important}}body{background:radial-gradient(1200px 420px at 85% -120px,rgba(11,110,110,.12),transparent),var(--bg)}

.grid>.stat{border-top:4px solid var(--brand)}.grid>.stat:nth-child(2){border-color:#FFCC00}.grid>.stat:nth-child(3){border-color:#2F5D9E}.grid>.stat:nth-child(4){border-color:#B8622E}
tr:hover td{background:var(--brand2)}.btn{transition:filter .15s,transform .1s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}
.hero{max-width:1000px;margin:30px auto;border-radius:22px;box-shadow:0 24px 60px rgba(18,44,56,.12)}
.hero .l{position:relative;isolation:isolate;overflow:hidden;padding:48px 40px;background:radial-gradient(circle at 12% 88%,rgba(88,208,184,.26),transparent 34%),linear-gradient(145deg,#126E72 0%,#163F50 100%)}
.hero .l:after{content:"";position:absolute;z-index:-1;width:280px;height:280px;right:-115px;top:-125px;border:1px solid rgba(255,255,255,.16);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025)}
.hero .l h1{font-size:clamp(34px,4vw,46px);max-width:420px;letter-spacing:-.045em}

.hero .l li{padding-left:4px;margin:11px 0;color:rgba(255,255,255,.88)}

  case'showlogin':S.auth='login';render();window.scrollTo(0,0);break;
  case'showhome':S.auth='landing';render();window.scrollTo(0,0);break;
 case'register':{const g=id=>$('#'+id).value.trim(),err=m=>{$('#err').textContent=m},role=$('#rr').value,e=g('re').toLowerCase();
  if(!g('rn'))return err('Enter your full name.');
  if(!/^\S+@\S+\.\S+$/.test(e))return err('Enter a valid email address.');
  if(ACC.some(x=>x.e===e))return err('This email is already registered.');
  if(role==='teacher'&&!g('rq'))return err('Enter your qualification.');
  if($('#r1').value.length<8)return err('Password must have at least 8 characters.');
  if($('#r1').value!==$('#r2').value)return err('Passwords do not match.');
  const acc={e,role,name:g('rn'),label:g('rn'),pw:$('#r1').value};
  if(role==='teacher'){acc.status='PENDING';ACC.push(acc);S.apps.unshift({id:Date.now(),n:acc.name,e,q:g('rq'),x:g('rx')||'-',st:'PENDING'});notify('admin','New teacher application from '+acc.name);S.auth='login';render();toast('Application sent. Sign in to see your approval status.')}
  else{ACC.push(acc);S.user=acc;S.role='student';S.me.student=acc.name;S.view='home';render();toast('Welcome, '+acc.name.split(' ')[0]+'. Your account is ready.')}
  break}
  case'logout':S.user=null;S.auth='landing';S.view='home';S.sel=null;render();toast('You have been signed out.');break;
 case'go':setView(v);break;
 case'hack':S.view='forbidden';render();break;
 case'bell':S.panel=!S.panel;render();break;
 case'room':S.room=n;render();break;
 case'ask':S.room=n;setView('msgs');break;
 case'send':case'ann':{const t=$('#mt').value.trim();if(!t){toast('Write a message first.');break}const ann=a==='ann',c=S.courses.find(x=>x.id===n);
  S.msgs.push({c:n,who:S.user.name,text:esc(t),t:'now',ann});notify(S.role==='student'?'teacher':'student',(ann?'New announcement in ':'New message in ')+c.t);render();const ch=$('#chat');if(ch)ch.scrollTop=ch.scrollHeight;break}
 case'detail':S.sel=n;setView('detail');break;
 case'buy':S.sel=n;setView('buy');break;
 case'open':S.sel=n;S.lesson=0;setView('learn');break;
 case'lesson':S.lesson=n;render();break;
 case'submit':{const pm=$('#pm').value.trim(),pr=$('#pr').value.trim();if(pm.length<10||pr.length<6){toast('Paste the full payment message and a valid reference.');break}
  if(S.pay.some(x=>x.ref.toLowerCase()===pr.toLowerCase())){toast('This transaction reference was already submitted.');break}const c=S.courses.find(x=>x.id===n);S.pay.unshift({id:Date.now(),stu:S.me.student,c:n,amt:c.price,st:'PENDING',ref:pr,msg:pm,d:'30/09/2026'});toast('Payment submitted. Status: PENDING');setView('payments');break}
 case'watch':{const a2=S.prog[K(S.sel)];a2[S.lesson]=Math.min(100,(a2[S.lesson]||0)+Math.round(1000/S.lessons[S.lesson].min));render();break}
 case'skip':{const a2=S.prog[K(S.sel)];if((a2[S.lesson]||0)<S.settings.threshold){toast('Watch at least '+S.settings.threshold+'% first.');break}render();break}
 case'tapp':decide(S.apps,n,'APPROVED','',x=>{const c=ACC.find(y=>y.e===x.e);if(c)delete c.status;toast(x.n+' approved. Teaching enabled.')});render();break;
 case'trej':{const w=prompt('Rejection reason','Please provide a valid teaching qualification.');if(w===null)break;decide(S.apps,n,'REJECTED',w,x=>{const c=ACC.find(y=>y.e===x.e);if(c){c.status='REJECTED';c.why=w}toast(x.n+' rejected.')});render();break}
 case'papp':decide(S.pay,n,'APPROVED','',x=>{notify('student','Your payment for '+S.courses.find(c=>c.id===x.c).t+' has been approved. Your course is now available.');{const cc=S.courses.find(c=>c.id===x.c);if(!cc.stu.includes(x.stu))cc.stu.push(x.stu)}toast('Approved. Enrollment created, course unlocked.')});render();break;
 case'prej':{const w=prompt('Rejection reason','Payment could not be verified. Please submit a valid transaction message.');if(w===null)break;decide(S.pay,n,'REJECTED',w,x=>{notify('student','Your payment was rejected. Reason: '+w);toast('Rejected. Course stays locked.')});render();break}
 case'tst':S.sel=n;setView('tstudents');break;
 case'saveth':{const t=+$('#th').value;if(t<50||t>100){toast('Enter a value from 50 to 100.');break}S.settings.threshold=t;const sh=+$('#sh').value;if(sh<0||sh>100){toast('Share must be 0 to 100.');break}S.settings.share=sh;S.settings.sms=$('#sm').checked;toast('Saved');break}
 case'mock':toast('Saved (demo)');break}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.user&&e.target.tagName==='INPUT')document.querySelector('[data-a=login],[data-a=register],[data-a=doreset]').click()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mt')document.querySelector('[data-a=send]').click()});
document.addEventListener('change',e=>{if(e.target.id==='rr')$('#tx').style.display=e.target.value==='teacher'?'block':'none'});
let idle;const bump=()=>{clearTimeout(idle);if(S.user)idle=setTimeout(()=>{S.user=null;render();toast('Signed out after 10 minutes of inactivity.')},600000)};
['click','keydown'].forEach(ev=>document.addEventListener(ev,bump));
render();
</script></body></html>
